<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow Movement</title>
    <link rel="stylesheet" href="./style.css"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  </head>
  
  <body>
    <header>
      <div class="hero">
        <div class="hero-overlay">
          <h1>Flow Movement</h1>
          <h2> - with Gabriella</h2>
        </div>     
      </div>
    </header>
    
    <main>

      <!-- Headline for the form -->
      
      <div class="form-header">
        <h3>Create an account.</h3>
        <h4>Let's get started with your 14 day free trial.</h4>
      </div>
      

      <!-- Signup form -->


      <form action="http://httpbin.org/anything" method="post">
        <fieldset class="form-fieldset">
          <legend>Personal Information</legend>
          
          <label class="fname">
            <span>First name</span>
            <input 
            id="fname"
            class="fill-out-form" 
            required type="text" 
            name="fname" 
            placeholder="Your first name"
            autocomplete="given-name">
          </label>

          <label class="lname">
            <span>Last name</span>
            <input 
            id="lname"
            class="fill-out-form" 
            required type="text" 
            name="lname" 
            placeholder="Your last name"
            autocomplete="family-name">
          </label>
          
          <label class="email">
            <span>Email adress</span>
            <input 
            id="email"
            class="fill-out-form" 
            required type="email" 
            name="Your email-adress" 
            placeholder="Email address"
            autocomplete="email">
          </label>
          
          <label class="phone">
            <span>Phone</span>
            <input 
            id="phone"
            class="fill-out-form" 
            required
            type="tel" 
            name="phone" 
            placeholder="Your phone number"
            autocomplete="tel">
          </label>

          <label class="password">
            <span>Password</span>
            <input 
            id="password"
            class="fill-out-form" 
            required type="password" 
            name="password" 
            minlength="8" 
            placeholder="Your password"
            autocomplete="new-password">
          </label>
          
          <label class="confirm-password">
            <span>Confirm Password</span>
            <input 
            id="confirm-password"
            class="fill-out-form" 
            required type="password" 
            name="confirm-password" 
            minlength="8" 
            placeholder="Confirm your password"
            autocomplete="new-password">
          </label>
          
          <label class="country" for="country-select">
            <span>Country</span>
              <select id="country-select" name="country">
              <option value="" disabled selected>Select your country</option>
              <option value="SE">Sweden</option>
              <option value="NO">Norway</option>
              <option value="FI">Finland</option>
              <option value="DK">Denmark</option>
              <option value="IS">Iceland</option>
            </select>
          </label>
         
        </fieldset>
            


        <!--   RADIOBOXES    RADIOBOXES    RADIOBOXES    RADIOBOXES      -->

        
            
        <fieldset class="contact-method">
          <legend>Please select your preferred contact method:</legend>
            <div class="contact-method-container">
           
            
              <div class="radio-button-container">
                
                <div class="radio-button-box" >
                  <input
                  type="radio"
                  id="contact-choice-1"
                  name="contact"
                  value="email"
                  checked
                  aria-label="Email contact option" />
                  <label for="contact-choice-1">Email</label>
                </div>
                
                <div class="radio-button-box">
                  <input 
                  type="radio" 
                  id="contact-choice-2" 
                  name="contact" 
                  value="phone"
                  aria-label="Phone contact option" />
                  <label for="contact-choice-2">Phone</label>
                </div>
                
                <div class="radio-button-box">
                  <input 
                  type="radio" 
                  id="contact-choice-3" 
                  name="contact" 
                  value="mail"
                  aria-label="Mail contact option" />
                  <label for="contact-choice-3">Mail</label>
                </div>
              </div>
            </div>
        </fieldset>

        
        <!--  RADIOBOXES   END   RADIOBOXES   END   -->    
            
         
        





        <!--   CHECKBOXES   START   CHECKBOXES  START   CHECKBOXES  START   -->
            
            
        <fieldset class="agreement">
          <legend>Agreement</legend>
          
          <div class="agreement-box">
            <input
            type="checkbox" id="terms" 
            name="terms" 
            required />
            <label for="terms">I agree to the <a href="#">Terms</a> and <a href="#"> Privacy Policy.</a></label>
          </div>
              
          <div class="agreement-box">
            <input
            type="checkbox" 
            id="communication" 
            name="communication" />
            <label for="communication">I agree to recieve communications.</label>
          </div>
        
        </fieldset>
            
        
            
        <!--   CHECKBOXES END CHECKBOXES END CHECKBOXES END CHECKBOXES END CHECKBOXES END CHECKBOXES END  -->
        
                    
        <button type="submit">Create account!</button>
      
      </form>
            
      <div class="existing-account">
        <h4>Already have an account?<a href="#">Sign in now</a></h4>
      </div>
      
    </main>

      <footer>
        <div class="personal-info">
          
          <img src="./assets/flow-movement-logo.png" alt="Flow movement company logo">
          <div class="personal-info-links">
            <i style="font-size:24px" class="fa">&#xf09b;</i>
            <i style="font-size:24px" class="fa">&#xf08c;</i>
            <i class="fa fa-copyright">Gabriella Iofe</i>
          </div>

        </div>
      </footer>

  </body>
</html>
